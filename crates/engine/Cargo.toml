[package]
name = "engine"
edition.workspace = true
version.workspace = true
publish.workspace = true
autobins = false

[features]
pg-tests = []
mssql-tests = []
claude-smoke = []
ssh-tests = []

[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"

[[bin]]
name = "fake-az"
path = "src/bin/fake_az.rs"

[dependencies]
bytes = "1"
async-stream = "0.3"
tiberius = { path = "../../vendor/tiberius", version = "=0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"
parking_lot = "0.12"
iana-time-zone = "0.1"
keyring = "4.2"
libc = "0.2"
native-tls = "0.2"
postgres-native-tls = "0.5"
percent-encoding = "2"
quick-xml = "0.38"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
russh = { version = "=0.64.1", default-features = false, features = ["aws-lc-rs", "rsa"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
specta.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "time"] }
tokio-postgres = "0.7.18"
uuid.workspace = true
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
