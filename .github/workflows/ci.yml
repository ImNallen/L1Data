name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  PGUSER: l1data
  PGPASSWORD: l1data
  PGDATABASE: shop

jobs:
  frontend:
    name: pnpm lint, fmt, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm fmt:check
        run: pnpm fmt:check

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  workspace:
    name: cargo test --workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: workspace

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test --workspace
        run: cargo test --workspace

  windows:
    name: agent CLI lookup on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows

      - name: cargo test -p engine --lib shell_path
        run: cargo test -p engine --lib shell_path

      - name: cargo test -p engine --test assistant agent_path
        run: cargo test -p engine --test assistant agent_path

  database:
    name: pg-tests and bridge-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.PGUSER }}
          POSTGRES_PASSWORD: ${{ env.PGPASSWORD }}
          POSTGRES_DB: ${{ env.PGDATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U l1data -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --shm-size=1g
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: L1Data_dev_Str0ng
        ports:
          - 1434:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P L1Data_dev_Str0ng -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4

      - name: Install linker, OpenSSL, and psql
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            postgresql-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: database

      - name: Publish L1_DATA_TEST_PG
        run: |
          echo "shop database at 127.0.0.1:5432"
          printf 'L1_DATA_TEST_PG=%s\n' "postgres://${PGUSER}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE}" >> "$GITHUB_ENV"

      - name: Allow prepared transactions
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql "$L1_DATA_TEST_PG" -v ON_ERROR_STOP=1 -c "alter system set max_prepared_transactions = 5"
          docker restart "$PG_CONTAINER"
          until pg_isready -h 127.0.0.1 -U "$PGUSER" -d "$PGDATABASE"; do sleep 1; done
          test "$(psql "$L1_DATA_TEST_PG" -Atc 'show max_prepared_transactions')" = 5

      - name: Apply dev/seed.sql
        run: psql "$L1_DATA_TEST_PG" -v ON_ERROR_STOP=1 -f dev/seed.sql

      - name: Apply dev/mssql-seed.sql
        env:
          MSSQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: docker exec -i "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P L1Data_dev_Str0ng -C -b -I < dev/mssql-seed.sql

      - name: cargo build -p dev-bridge -p engine
        run: cargo build -p dev-bridge -p engine

      - name: dev/bridge-smoke.sh
        run: dev/bridge-smoke.sh

      - name: cargo test -p engine --features pg-tests
        run: cargo test -p engine --features pg-tests

      - name: cargo test -p engine --features mssql-tests
        run: cargo test -p engine --features mssql-tests

      - name: Mixed database bridge smoke
        run: python3 dev/mssql-smoke.py

      - name: SQL Server certificate verification
        run: python3 dev/mssql-tls-smoke.py

  postgres-versions:
    name: pg-tests on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ${{ env.PGUSER }}
          POSTGRES_PASSWORD: ${{ env.PGPASSWORD }}
          POSTGRES_DB: ${{ env.PGDATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U l1data -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --shm-size=1g
    steps:
      - uses: actions/checkout@v4

      - name: Install linker, OpenSSL, and psql
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            postgresql-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: postgres-versions

      - name: Publish L1_DATA_TEST_PG
        run: |
          echo "shop database at 127.0.0.1:5432"
          printf 'L1_DATA_TEST_PG=%s\n' "postgres://${PGUSER}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE}" >> "$GITHUB_ENV"

      - name: Allow prepared transactions
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql "$L1_DATA_TEST_PG" -v ON_ERROR_STOP=1 -c "alter system set max_prepared_transactions = 5"
          docker restart "$PG_CONTAINER"
          until pg_isready -h 127.0.0.1 -U "$PGUSER" -d "$PGDATABASE"; do sleep 1; done
          test "$(psql "$L1_DATA_TEST_PG" -Atc 'show max_prepared_transactions')" = 5

      - name: Apply dev/seed.sql
        run: psql "$L1_DATA_TEST_PG" -v ON_ERROR_STOP=1 -f dev/seed.sql

      - name: cargo test -p engine --features pg-tests
        run: cargo test -p engine --features pg-tests
