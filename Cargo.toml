[workspace]
resolver = "3"
members = ["crates/engine", "crates/dev-bridge", "src-tauri"]
exclude = ["vendor/tiberius"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# The large enums are IPC errors returned once per command and sessions held once per tab,
# so boxing them buys nothing.
[workspace.lints.clippy]
large_enum_variant = "allow"
result_large_err = "allow"

[workspace.dependencies]
engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "fs", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }
